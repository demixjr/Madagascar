<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Червень 2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      margin: 30px;
    }

    h1 {
      text-align: center;
      font-size: 46px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    thead th {
      border: 2px solid black;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      padding: 10px 5px;
    }

    tbody td {
      border: 2px solid black;
      text-align: center;
      font-size: 52px;
      font-weight: bold;
      padding: 15px 5px;
      color: black;
    }

    /* Колонка No. */
    thead th:first-child,
    tbody td:first-child {
      font-size: 20px;
      font-style: italic;
      width: 60px;
      color: black;
    }

    /* Субота (7) і Неділя (8)  зелений */
    tbody td:nth-child(7),
    tbody td:nth-child(8) {
      color: green;
    }

    /* 31 травня — перший рядок, 2-га клітинка  сірий */
    tbody tr:first-child td:nth-child(2) {
      color: #aaaaaa;
    }

    /* 1 червня (свято) — перший рядок, 3-тя клітинка  червоний */
    tbody tr:first-child td:nth-child(3) {
      color: red;
    }

    /* 15 червня (день народження) — 3-й рядок, 3-тя клітинка  помаранчевий */
    tbody tr:nth-child(3) td:nth-child(3) {
      color: orange;
    }

    /* 28 червня (День Конституції) — 5-й рядок, 2-га клітинка  червоний */
    tbody tr:nth-child(5) td:nth-child(2) {
      color: red;
    }

    /* 1,2,3,4,5 липня — 5-й рядок, клітинки 4-8  сірий */
    tbody tr:nth-child(5) td:nth-child(4),
    tbody tr:nth-child(5) td:nth-child(5),
    tbody tr:nth-child(5) td:nth-child(6),
    tbody tr:nth-child(5) td:nth-child(7),
    tbody tr:nth-child(5) td:nth-child(8) {
      color: #aaaaaa;
    }

  </style>
</head>
<body>
<script src="../../../js/back_script.js"></script>
    <script>
    BackButtonCreation();

</html>
