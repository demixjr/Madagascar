<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <title>Червень 2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      margin: 30px;
    }

    h1 {
      text-align: center;
      font-size: 46px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    thead th {
      border: 2px solid black;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      padding: 10px 5px;
    }

    tbody td {
      border: 2px solid black;
      text-align: center;
      font-size: 52px;
      font-weight: bold;
      padding: 15px 5px;
      color: black;
    }

    /* Колонка No. */
    thead th:first-child,
    tbody td:first-child {
      font-size: 20px;
      font-style: italic;
      width: 60px;
      color: black;
    }

    /* Субота (7) і Неділя (8)  зелений */
    tbody td:nth-child(6),
    tbody td:nth-child(7) {
      color: green;
    }
  </style>
</head>

<body>
  <script src="../../../js/back_script.js"></script>
  <script>
    BackButtonCreation();
  </script>
  <h1 id="month-year-title">Червень 2026</h1>
  <div id="calendar-container"></div>
  <nav>
    <button id="prev-btn">Попередній місяць</button>
    <button id="next-btn">Наступний місяць</button>
  </nav>
  <script src="../../../js/lab4.2.js"></script>
</body>

</html>
