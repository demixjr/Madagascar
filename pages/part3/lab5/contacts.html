<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HolidayTime - Контакти</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- СПІЛЬНА ШАПКА -->
<header class="main-header">
    <div class="logo">
        <img src="images/logo.png" alt="HolidayTime">
    </div>

    <nav class="nav-menu">
        <a href="index.html">ГОЛОВНА</a>
        <a href="about.html">ПРО НАС</a>
        <a href="booking.html">ЗАБРОНЮВАТИ</a>
        <a href="contacts.html" class="active">КОНТАКТИ</a> <!-- Активна вкладка -->
        <a href="profile.html">ОСОБИСТИЙ КАБІНЕТ</a>
    </nav>

    <div class="lang-dropdown">
        <div class="lang-current">
            <img src="images/planet.png" alt="UA" width="20">
            <span>UA</span>
        </div>
        <div class="lang-list">
            <a href="#">FR</a>
            <a href="#">EN</a>
        </div>
    </div>
</header>

<main class="container">
    <!-- ЗАГОЛОВОК СТОРІНКИ -->
    <section class="contacts-hero">
        <h2>Контакти</h2>
    </section>

    <!-- КОНТЕНТ (ГРІД) -->
    <section class="contacts-content">
        <div class="contacts-grid">

            <!-- РЯДОК 1 -->
            <div class="contact-item">
                <h4>Телефон</h4>
                <p>+38(097)119-89-83</p>
            </div>

            <div class="contact-item">
                <h4>Графік роботи</h4>
                <p>пн-пт 08:00-22:00</p>
                <p>сб 09:00-21:00</p>
                <p>вс 10:00-20:00</p>
            </div>

            <div class="contact-item">
                <h4>Ел. пошта</h4>
                <p>hello@gmail.com</p>
            </div>

            <!-- РЯДОК 2 -->
            <div class="contact-item office-address">
                <h4>Адреса офісу</h4>
                <p>м. Київ, вул. Малевича, буд. 4</p>
            </div>

            <!-- КАРТА -->
            <div class="contact-map">
                <!-- Використовуємо файл maps.jpg, який є у твоїй папці images -->
                <img src="images/maps.jpg" alt="Карта проїзду">
            </div>

        </div>
    </section>
</main>

<!-- СПІЛЬНИЙ ФУТЕР -->
<footer class="main-footer">
    <p>© 2021 HolidayTime. All rights reserved.</p>
</footer>

</body>
</html>
