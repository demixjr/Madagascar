<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Календар</title>

    <style>
        .calendar-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        button {
            cursor: pointer;
        }
        th,
        td {
            width: 40px;
            height: 40px;
            text-align: center;
            border: 1px solid #ccc;
        }

        td:nth-child(6),
        td:nth-child(7) {
            color: green;
        }

        tr:nth-child(1) td:nth-child(1),
        tr:nth-child(1) td:nth-child(4),
        tr:nth-child(1) td:nth-child(6),
        tr:nth-child(4) td:nth-child(1),
        tr:nth-child(4) td:nth-child(2),
        tr:nth-child(4) td:nth-child(7),
        tr:nth-child(5) td:nth-child(1),
        tr:nth-child(5) td:nth-child(7) {
            color: red;
        }

        tr:nth-child(3) td:nth-child(7) {
            color: blue;
        }

        tr:nth-child(5) td:nth-child(n+3) {
            color: gray;
        }
    </style>
</head>
